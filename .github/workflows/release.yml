# Release: every push to main is a release.
#
# Versioning (Conventional Commits, configured in GitVersion.yml; measured
# with the pinned GitVersion 6.8.2 rather than read off the regexes):
#   - the tag is the version: vX.Y.Z
#   - exactly one increment per release, however many commits landed since
#     the last tag: chore + docs + fix together -> patch once, not 3 times
#   - patch is a floor, not a reward: any commit at all bumps it, so a
#     chore-only push (a Dependabot merge) still ships a new release
#   - the commit messages only escalate that floor:
#       feat: (any scope)                     -> minor (1.0.6 -> 1.1.0)
#       <type>!: or a BREAKING CHANGE: footer -> major (1.x  -> 2.0.0)
#   - no prereleases: every push to main is a real, stable release
#   - feature branches are built locally, never released
#
# The windows-latest runner is required: the plugin targets .NET Framework
# 4.6.2 / WPF, which only builds on Windows.
#
# Third-party Actions are pinned to full commit SHAs, not moving tags. A tag
# name (`@v4`) is a ref somebody else can move: whoever controls that repo can
# point it at different code, and this job runs on every push to main with
# `contents: write` and packages what it produces into the .pext users install.
# A SHA names the exact code that ran. Dependabot (.github/dependabot.yml) is
# what keeps these pins current; the comments after each pin say which release
# the SHA is, so a bump is reviewable as a diff instead of a magic number. The
# SHA has to be the commit the tag points at: a tag can be an annotated tag
# object with its own SHA (softprops/action-gh-release v3.0.3 is one, object
# e598afbe... over commit efb35369...), and a tag-object pin is neither valid
# in `uses:` nor fixed - it moves with the tag.
#
# Gate order is deliberate: every gate runs before this job writes anything, so
# a release that fails a gate cannot leave a tag behind. The tag is the version,
# so a tag pushed before the gates run has already consumed that version number,
# names a commit that was never shipped, and becomes the base the NEXT release
# computes its version and its notes from.
#
# Restore is locked (Directory.Build.props + the committed packages.lock.json
# files): the package graph that ships is a reviewed file in this repo, not a
# resolution the runner makes at release time. Measured here on SDK 8.0.427: a
# csproj asking for a version the lock file does not name fails restore with
# NU1004, and a lock file whose recorded content hash no longer matches the
# package fails with NU1403 ("The package is different than the last restore").
#
# Git input is named, not assumed: no `fetch-depth: 0` (checkout documents that
# as "all history for all branches and tags"), and no step puts an
# event-provided ref name into a shell command. The history and tags this job
# reads are fetched by explicit refspec, from a branch name checked against the
# literal this file releases from.
name: Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (default: next version from the commits)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    # Two pushes to main in a row must not both resolve the same version and
    # race on creating/pushing the tag and the release.
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - name: "Checkout (the triggering commit only)"
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: "Fetch the history and tags this job reads, by named refspec"
        # Why not `fetch-depth: 0`: checkout describes it as fetching "all
        # history for all branches and tags", and everything this job decides -
        # the version, the tag-scheme check, the release notes - is read out of
        # git. Name the refs instead of widening the object store, and take the
        # branch name from this file rather than from an event-provided variable
        # (no step here reads GITHUB_REF/GITHUB_HEAD_REF; the name is validated
        # against the literal `main` this workflow releases from, which also
        # refuses a manual run started on a feature branch).
        #
        # Measured on git 2.56 with the same shape checkout performs (fetch one
        # sha at depth 1, checkout it): a later `git fetch` of a named refspec
        # WITHOUT a depth option does not deepen a shallow repo - HEAD stayed at
        # 1 commit - while `--unshallow` on the named refspec does (1 -> 7
        # commits), and afterwards the only refs in the repo are the ones named
        # here. Tags are fetched as their own named refspec, which is what
        # `git describe --tags --match v*` and the tag-scheme check below read.
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_NAME -ne "main") {
            throw "this workflow releases from main only, but it ran on " +
                  "'$env:REF_NAME' - refusing to version a release off a " +
                  "branch the tag rules do not count"
          }
          # --unshallow only where the clone is actually shallow: git refuses
          # it on a complete repository ("--unshallow on a complete repository
          # does not make sense"), and .git/shallow is what marks the shallow
          # case a depth-limited fetch leaves behind.
          $deepen = @()
          if (Test-Path -LiteralPath '.git/shallow') {
            $deepen = @('--unshallow')
          }
          git fetch --no-tags $deepen origin `
            "+refs/heads/main:refs/remotes/origin/main"
          git fetch origin "+refs/tags/*:refs/tags/*"
          # Fail closed: every decision below (the version, the tag-scheme
          # check, the notes range) reads history out of this clone, and a
          # history that did not arrive does not report itself - it just makes
          # `git describe` answer with nothing. Measured: an unknown id prints
          # "fatal: bad object" to stderr while `git log` still exits 0.
          git rev-parse --verify refs/remotes/origin/main 2>$null |
            Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "origin/main is not in this clone: refusing to version a " +
                  "release from history this job cannot read"
          }

      # actions/setup-dotnet v6.1.0 (was v6.0.0 / a98b5685...: upstream has
      # since released v6.1.0, and an unmoved pin is how a pin quietly rots)
      - name: Setup .NET SDK (pinned in global.json)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          # The cache key is the content of the named lock files, so a changed
          # package graph cannot reuse a cache - it gets a new key.
          cache: true
          cache-dependency-path: |
            source/packages.lock.json
            tests/packages.lock.json

      - name: Install GitVersion.Tool
        # Exact version, matching GitVersion.MsBuild in the csproj: a floating
        # `6.*` means the version a release got can change after the fact
        # (yesterday's build and today's rebuild of the same commit would not
        # even agree on what the version is).
        #
        # Asserted, not requested: this step downloads and then runs a NuGet
        # package, and `dotnet tool install` is not part of the project graph,
        # so the package audit below never sees it. The check is that the
        # version which actually landed is the version this file names.
        shell: pwsh
        run: |
          dotnet tool install --global GitVersion.Tool --version 6.8.2
          $installed = dotnet tool list --global | Out-String
          if ($LASTEXITCODE -ne 0) { throw "tool list failed: $installed" }
          if ($installed -notmatch 'GitVersion\.Tool\s+6\.8\.2') {
            throw ("GitVersion.Tool 6.8.2 was requested but is not what " +
                   "landed:`n$installed")
          }

      - name: "Vulnerable packages (supply-chain gate)"
        # Fails the release if this project - or anything it pulls in - depends
        # on a package with a known advisory. The plugin parses hostile web
        # input inside System.Text.Json's code path, so an unpatched transitive
        # dependency is part of the attack surface, not a hygiene note.
        #
        # The bare command is not a gate, measured rather than assumed:
        #   - it reads obj/project.assets.json, so on a runner that has not
        #     restored yet it exits 1 with "No assets file was found". Release
        #     run #1 died here for exactly that reason and every later step
        #     (tag, release) was skipped.
        #   - when findings do exist it prints them and still exits 0
        #     (dotnet/sdk#16852), so the command alone would ship an advisory
        #     dependency while reporting success.
        # So: restore first, read the findings out of --format json, and let a
        # non-empty list stop the release. Both directions checked locally - the
        # plugin project passes from a deleted obj/, a project pinning
        # System.Text.RegularExpressions 4.3.0 fails with its advisory
        # findings listed.
        # Both projects, not only the shipped one: the test packages are not in
        # the .pext, but their code runs on this runner with this job's token
        # (Microsoft.NET.Test.Sdk and NUnit3TestAdapter drive the test host), so
        # an advisory in them is a compromise of the build, not of a plugin the
        # user happens not to install.
        shell: pwsh
        run: |
          $projects = @(
            "source/Playnite.VRMods.csproj",
            "tests/Playnite.VRMods.Tests.csproj"
          )
          # Locked: what is judged here is the graph the committed lock files
          # name, which is the same graph the build and the .pext then use.
          # A failure here stops the release and stays a failure: a release
          # job never regenerates a lock file (the PR-side step in ci.yml
          # prints the regenerated diff a human commits before merging).
          # If main ever reaches this state, main's csproj/lock pair is
          # broken and must be repaired before the next release.
          dotnet restore Playnite.VRMods.sln --locked-mode
          $findings = @()
          $audited = 0
          foreach ($proj in $projects) {
            $audit = dotnet list $proj package --vulnerable `
              --include-transitive --format json | Out-String
            if ($LASTEXITCODE -ne 0) { throw "package audit failed: $audit" }
            $json = $audit | ConvertFrom-Json
            # Fail closed: an audit that names no project is not a pass.
            if (-not $json.projects) {
              throw "audit named no project for '${proj}' - refusing an " +
                    "unaudited release"
            }
            $audited += $json.projects.Count
            foreach ($p in $json.projects) {
              foreach ($fw in @($p.frameworks)) {
                # A clean project reports no frameworks section at all.
                if (-not $fw) { continue }
                $pkgs = @($fw.topLevelPackages)
                $pkgs += @($fw.transitivePackages)
                foreach ($pkg in $pkgs) {
                  foreach ($vuln in @($pkg.vulnerabilities)) {
                    $line = $pkg.id + " " + $pkg.resolvedVersion
                    $line += " [" + $vuln.severity + "] " + $vuln.advisoryurl
                    $findings += $line
                  }
                }
              }
            }
          }
          if ($findings.Count -gt 0) {
            $findings | ForEach-Object { Write-Host $_ }
            Write-Host "::error::vulnerable dependency ($($findings.Count))"
            exit 1
          }
          Write-Host ("No vulnerable packages across $audited audited " +
                      "project framework entry(ies).")

      - name: "Code analysis (gate: runs before the tag exists)"
        # AGENTS.md requires a 0-warning build, and the plugin project turns the
        # .NET analyzers on (net462 leaves them off by default). Neither
        # `dotnet build` nor `dotnet test` fails on a warning, so the gate names
        # them: any analyzer warning (": warning CA") stops the release.
        # The build already runs every family; .editorconfig carries the
        # families that were judged and excluded, each with its reason, so this
        # step covers every family not excluded there (AGENTS.md, "Analyzers").
        # Restore warnings (NU...) are out of scope - they come from third-party
        # packages, not from this code.
        #
        # --no-restore: the audit step above already restored the solution in
        # locked mode, and a gate that re-resolves is a gate on a graph other
        # than the one that ships.
        #
        # Position matters: this step used to run AFTER the version tag was
        # pushed, so a commit that failed it still consumed a version number and
        # still left a tag that the next release measures its version and its
        # notes against.
        shell: pwsh
        run: |
          dotnet build source/Playnite.VRMods.csproj -c Release `
            --no-restore -v n | Tee-Object -FilePath ca-analysis.log
          $buildExit = $LASTEXITCODE
          $pattern = ': warning CA'
          $found = @(Select-String -Path ca-analysis.log -Pattern $pattern)
          if ($found.Count -gt 0) {
            $found | ForEach-Object { Write-Host $_.Line }
            Write-Host "Analyzer warnings found: $($found.Count)"
            Write-Host "::error::build must stay warning-free (AGENTS.md)"
            exit 1
          }
          exit $buildExit

      - name: "Test (gate: runs before the tag exists)"
        run: >-
          dotnet test tests/Playnite.VRMods.Tests.csproj
          -c Release --no-restore

      - name: Resolve version + tag
        id: ver
        # Runs only after every gate above has passed, so a release that cannot
        # be built or tested no longer leaves a published tag behind. The tag is
        # still created before Build-Release.ps1 runs: that script does not
        # stamp a version itself (dotnet publish gets no version argument), so
        # the only
        # version the shipped DLL can report is one read from the tags reachable
        # from HEAD, and the script compares that stamp against the label.
        #
        # The dispatch input is named here instead of relying on the implicit
        # INPUT_<NAME> variable workflow_dispatch creates: an implicit name is
        # plumbing nobody reviews, and this step is the one that decides the
        # version a user installs.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $lastTag = git describe --tags --match "v*" --abbrev=0 2>$null

          # Every release tag must be exactly vX.Y.Z, because the two tools
          # that read tags here do not read them the same way (measured on
          # GitVersion 6.8.2 + git 2.56): describe matches v1.2.0.1 and
          # v1.2.0-beta1 but not a bare 2.0.0; GitVersion counts a bare 2.0.0
          # and v1.2.0-beta1 as versions (1.2.0-beta1 -> 1.2.0) and ignores
          # v1.2.0.1. A tag outside both shapes makes the next version
          # unresolvable - it would be published under a version that exists.
          $stray = git tag --list | Where-Object { $_ -match '^v?\d+\.\d+' }
          $stray = @($stray | Where-Object { $_ -notmatch '^v\d+\.\d+\.\d+$' })
          if ($stray) {
              throw "version tag(s) outside the vX.Y.Z scheme: " +
                    (($stray | Sort-Object) -join ", ") +
                    " - describe and GitVersion read them differently, so " +
                    "the next release version cannot be resolved safely"
          }

          if ($env:INPUT_VERSION) {
              # Manual run with an explicit version (e.g. a re-cut), 3-part
              # only: that is the shape every other rule here counts. A 4-part
              # value would tag v1.2.0.1, which 'git describe --match v*'
              # matches (so this step no longer treats the repo as untagged)
              # while GitVersion ignores it (measured on 6.8.2: MajorMinorPatch
              # stayed 0.1.0) - the next release would then land under a
              # version that already exists.
              if ($env:INPUT_VERSION -notmatch '^\d+\.\d+\.\d+$') {
                  throw "INPUT_VERSION '$env:INPUT_VERSION' must be exactly " +
                        "major.minor.patch: 3 parts is the only shape this " +
                        "project's versioning counts"
              }
              $version = $env:INPUT_VERSION
          } elseif (-not $lastTag) {
              # First release: no version-shaped tag exists (checked above).
              $version = "1.0.0"
          } else {
              # Next stable version from the Conventional Commits since the
              # last tag. MajorMinorPatch is the stable version; the suffix
              # only appears in FullSemVer, which we never use.
              # '-l' is GitVersion's LOGFILE option, not an output format: on
              # 6.8.2 (measured) 'dotnet-gitversion -l json' writes a log file
              # named 'json' into the workspace and only prints JSON because
              # JSON is already the default. -output is the format option; with
              # no -showvariable GitVersion emits the whole map.
              $gv = dotnet-gitversion -output json | ConvertFrom-Json
              $version = $gv.MajorMinorPatch
          }
          $parsed = $null
          if (-not [Version]::TryParse($version, [ref]$parsed)) {
              throw "version '$version' is not a parseable .NET Version"
          }
          # Idempotent: create the tag only if it does not exist yet.
          $existing = git tag --list "v$version"
          if (-not $existing) {
              git tag "v$version"
              git push origin "v$version"
          }
          # The base for the release notes and for GitHub's compare link: the
          # tag this release follows. $lastTag was read before the tag above was
          # created, so it is normally that tag. On a re-run of a version that
          # is already tagged it points at this very release, so step one commit
          # back to the release before it.
          $notesBase = $lastTag
          if ($notesBase -eq "v$version") {
              $notesBase = git describe --tags --match "v*" --abbrev=0 `
                  "v$version^" 2>$null
          }
          "version=$version" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "previous_tag=$notesBase" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build release package (.pext)
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: ./tools/Build-Release.ps1 -Version $env:RELEASE_VERSION

      # softprops/action-gh-release v3.0.3 (folded scalar: the full SHA pin
      # is longer than this file's 80-column limit)
      - name: Build release notes
        # GitHub's own notes for this repo are only the compare link: measured
        # on v1.0.0..v1.1.0, every release body was that single line, so the
        # part that says what changed has to be written here. Commit headers
        # are already commitlint-constrained, so their subjects read as
        # changelog lines.
        env:
          PREVIOUS_TAG: ${{ steps.ver.outputs.previous_tag }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $range = if ($env:PREVIOUS_TAG) {
            "$env:PREVIOUS_TAG..HEAD"
          } else { "HEAD" }
          $subjects = @(git log --no-merges --format="%s" $range 2>$null)
          $groups = [ordered]@{ Features = @(); Fixes = @(); Other = @() }
          foreach ($s in $subjects) {
            $text = ($s -replace '^[a-z]+(\([^)]*\))?!?:\s*', '').Trim()
            if (-not $text) { $text = $s }
            if ($s -like 'feat*') { $groups.Features += $text }
            elseif ($s -like 'fix*') { $groups.Fixes += $text }
            else { $groups.Other += $text }
          }
          $lines = New-Object System.Collections.Generic.List[string]
          if ($groups.Features.Count) {
            $lines.Add('### New features')
            $groups.Features | ForEach-Object { $lines.Add("- $_") }
          }
          if ($groups.Fixes.Count) {
            $lines.Add('### Fixes')
            $groups.Fixes | ForEach-Object { $lines.Add("- $_") }
          }
          if ($groups.Other.Count) {
            $lines.Add('### Other changes')
            $groups.Other | ForEach-Object { $lines.Add("- $_") }
          }
          if ($lines.Count -eq 0) {
            $lines.Add('No commits since the previous release.')
          }
          if (-not (Test-Path dist)) {
            New-Item -ItemType Directory dist | Out-Null
          }
          # Check the package exists before publishing notes about it, and
          # publish the SHA-256 of the exact bytes this job built: a user
          # installs this file off the release page, and the release page -
          # including its assets - is writable by anyone who can write to this
          # repo. A checksum written here is a check on the download that does
          # not depend on trusting the download.
          $pext = "dist/VRMod.Tags-$env:RELEASE_VERSION.pext"
          if (-not (Test-Path -LiteralPath $pext)) {
            throw "expected release package '$pext' is missing: refusing to " +
                  "publish a release with no package to hash"
          }
          $hash = (Get-FileHash -Algorithm SHA256 `
            -LiteralPath $pext).Hash.ToLowerInvariant()
          $lines.Add("")
          $lines.Add('SHA-256 of VRMod.Tags-' +
                     "$env:RELEASE_VERSION.pext:")
          $lines.Add("")
          $lines.Add('```text')
          $lines.Add($hash)
          $lines.Add('```')
          $lines | Set-Content -Path dist/release-notes.md -Encoding utf8
          $lines | ForEach-Object { Write-Host $_ }

      - name: Create GitHub release
        uses: >-
          softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: "v${{ steps.ver.outputs.version }}"
          files: "dist/VRMod.Tags-${{ steps.ver.outputs.version }}.pext"
          # The action's default is to keep going when a files: glob matches
          # nothing, which would publish a release with no package at all.
          fail_on_unmatched_files: true
          body_path: dist/release-notes.md
          # At this pin the action prepends body_path content to the notes it
          # generates, and previous_tag sets the base GitHub compares against -
          # so the compare link GitHub adds names the same previous tag this
          # job resolved, instead of guessing.
          previous_tag: ${{ steps.ver.outputs.previous_tag }}
          generate_release_notes: true
          # v3.0.3 declares no `overwrite` input. The key this step carried
          # was unknown to the action, so the runner warned
          # ("Unexpected input(s) 'overwrite'") and ignored it. The real one
          # is `overwrite_files`: it replaces an existing asset of the same
          # name instead of stacking a second copy when a version is re-cut.
          # It defaults to true at this pin - stated here so a future change
          # to that upstream default cannot silently start stacking duplicate
          # .pext files on a re-release.
          overwrite_files: true
